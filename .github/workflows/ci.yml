# Build and test on every push to dev/main and on every pull request.
# macOS is the supported platform: build, all tests, failures block. Linux and Windows are built and
# tested as well, but are not ported yet (Metal-only offscreen rendering, untested input and
# packaging), so their failures are reported without failing the run.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Open-source Qt; the newest 6.8 release published for open-source users.
  QT_VERSION: 6.8.3
  QT_MODULES: qtmultimedia qtshadertools

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
            experimental: false
          - name: Linux (experimental)
            os: ubuntu-24.04
            experimental: true
          - name: Windows (experimental)
            os: windows-2025
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Xcode 26.6 (the C++23 library parts the code uses need it)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 libgl1-mesa-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libegl1 libpulse0
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      # SDL3 for gamepads is built once into ~/.cache/qtcraft/sdl3 (decision E-540); the key
      # follows the tag and the build script (whose CONFIG_VERSION names the build options).
      # Windows builds it too, through Git Bash and with the debug C runtime of the Debug build
      # (decision E-861), so the job builds the game as players get it, with gamepads.
      - name: SDL3 cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/qtcraft/sdl3
          key: sdl3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('3rdparty/sdl3-tag.txt', 'scripts/build-sdl.sh') }}

      - name: Configure
        run: cmake --preset ci-debug

      - name: Build
        run: cmake --build --preset ci-debug

      - name: Test
        run: ctest --preset ci-debug --timeout 600

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ runner.os }}
          path: build/ci-debug/Testing/Temporary/
          retention-days: 14
