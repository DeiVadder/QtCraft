# The web handbook and the API reference on GitHub Pages: publishes web/ (start page web/index.html,
# /handbook/, /api/). Neither the handbook's data (web/handbook/data) nor the API reference (web/api)
# is in git: the first job builds qtcraft-headless with the steps of ci.yml (macOS, without gamepads
# and TLS, which the export does not use), writes the data with --export-handbook-web, as
# scripts/export-handbook.sh does locally, generates the API reference with QDoc from the same
# configuration (scripts/api-docs.py, decision E-939), and uploads web/ as the Pages artifact; the
# second job deploys it. Runs on every push to main, since both follow the content and the code.
# Needs Settings, Pages, Source "GitHub Actions" once.
name: Pages
# (registered on the default branch by touching this file after the first push)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The same Qt as ci.yml.
  QT_VERSION: 6.8.3
  QT_MODULES: qtmultimedia qtshadertools

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ninja
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Build qtcraft-headless
        run: |
          cmake --preset ci-debug -DQC_GAMEPAD=OFF -DQC_TLS=OFF
          cmake --build --preset ci-debug --target qtcraft-headless

      - name: Export the handbook data
        run: build/ci-debug/src/headless/qtcraft-headless --no-mods --export-handbook-web web/handbook/data

      # Qt's documentation index files, only for links from the API reference to Qt's own docs
      # (doc.qt.io); without them the reference has no such links but is complete otherwise.
      - name: Qt documentation index files
        continue-on-error: true
        run: |
          python3 -m pip install --quiet aqtinstall
          python3 -m aqt install-doc mac ${{ env.QT_VERSION }} --outputdir "$RUNNER_TEMP/qt-docs" \
            --archives qtcore qtgui qtnetwork qtconcurrent qtqml qtqmlmodels qtquick qtquickcontrols qtmultimedia qttestlib qtdoc
          echo "QC_QT_DOCS=$RUNNER_TEMP/qt-docs/Docs/Qt-${{ env.QT_VERSION }}" >> "$GITHUB_ENV"

      # qdoc comes with the Qt tools of the Qt installation ($QT_ROOT_DIR/bin, set by install-qt-action).
      # The reference covers the whole tree; a qdoc warning in a fully documented folder
      # (scripts/doc-folders.txt) fails the step, warnings elsewhere are not counted (E-939).
      - name: API reference
        run: |
          test -x "$QT_ROOT_DIR/bin/qdoc" || { echo "no qdoc in $QT_ROOT_DIR/bin"; exit 1; }
          python3 scripts/api-docs.py --qdoc "$QT_ROOT_DIR/bin/qdoc" \
            --compile-commands build/ci-debug/compile_commands.json --out web/api \
            --documented --max-warnings 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
