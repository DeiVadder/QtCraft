# Licence and copyright of the files without their own SPDX header (REUSE specification 3.2):
# content and mods (JSON), data, documentation, images, translations and configuration. Source files
# carry the header themselves (scripts/add-spdx.py); third-party parts keep their own licence.
# Decision E-932.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 the QtCraft authors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The logo's pixel font, unchanged (THIRD_PARTY.md).
[[annotations]]
path = "src/app/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2021 The Pixelify Sans Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Licence texts of third-party parts that the release packages carry (Qt, FFmpeg): the FSF's texts,
# which may be copied verbatim only.
[[annotations]]
path = "licenses-third-party/**"
precedence = "override"
SPDX-FileCopyrightText = ["1991, 1999 Free Software Foundation, Inc.", "2007 Free Software Foundation, Inc."]
SPDX-License-Identifier = "LicenseRef-FSF-verbatim"
