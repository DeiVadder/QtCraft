# Build and test on every push to dev/main and on every pull request.
# macOS is the supported platform: build, all tests, failures block. Linux and Windows are built and
# tested as well, but are not ported yet (Metal-only offscreen rendering, untested input and
# packaging), so their failures are reported without failing the run.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: Also run the tests (several hours on the hosted runners)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Open-source Qt; the newest 6.8 release published for open-source users.
  QT_VERSION: 6.8.3
  QT_MODULES: qtmultimedia qtshadertools

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # The first run builds everything (about 1.5 h on the macOS runner); later runs reuse ccache.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-26
            experimental: false
          - name: Linux (experimental)
            os: ubuntu-24.04
            experimental: true
          - name: Windows (experimental)
            os: windows-2025
            experimental: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Xcode 26.6 (the C++23 library parts the code uses need it)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      # The Debug test programs fill the runner's disk (the job was stopped near the end of the
      # build twice): remove preinstalled SDKs the build does not use.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 libgl1-mesa-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libegl1 libpulse0 ccache
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Ninja and ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      # Qt 6.8.3 still links the AGL framework, which the macOS 26 SDK no longer has (later 6.8
      # releases dropped it): take it out of Qt's OpenGL wrapper before configuring.
      - name: Qt without AGL (macOS 26 SDK)
        if: runner.os == 'macOS'
        run: |
          f="$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"
          if [ -f "$f" ]; then
            sed -i '' -e 's/\${__opengl_agl_fw_path}//g' -e '/find_library(WrapOpenGL_AGL/d' "$f"
            if grep -q 'opengl_agl_fw_path}' "$f"; then echo "AGL still linked in $f"; exit 1; fi
          fi

      # SDL3 for gamepads is built once into ~/.cache/qtcraft/sdl3 (decision E-540); the key
      # follows the tag and the build script (whose CONFIG_VERSION names the build options).
      # Windows builds it too, through Git Bash and with the debug C runtime of the Debug build
      # (decision E-861), so the job builds the game as players get it, with gamepads.
      - name: SDL3 cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/qtcraft/sdl3
          key: sdl3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('3rdparty/sdl3-tag.txt', 'scripts/build-sdl.sh') }}

      # Compiler cache across runs (QC_CCACHE uses ccache when it is found; Windows has it from
      # Strawberry Perl). One entry per OS, refreshed by every run.
      - name: ccache directory
        shell: bash
        run: |
          {
            echo "CCACHE_DIR=${{ runner.temp }}/ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_BASEDIR=${{ github.workspace }}"
          } >> "$GITHUB_ENV"

      # Restored here, saved after the build even when it fails or is cancelled, so a long first
      # build is not lost (actions/cache saves only after a successful job).
      - name: ccache restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ci-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-ci-${{ runner.os }}-

      # OpenSSL is built once into ~/.cache/qtcraft/openssl (decision E-872).
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/qtcraft/openssl
          key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('3rdparty/openssl-version.txt', 'scripts/build-openssl.sh', 'scripts/windows/build-openssl.ps1') }}

      # Linux and Windows are experimental: warnings stay warnings there, so one run lists all of
      # them (the release workflow builds Windows with warnings as errors).
      - name: Configure
        run: cmake --preset ci-debug ${{ runner.os != 'macOS' && '-DQC_WARNINGS_AS_ERRORS=OFF' || '' }}

      # Experimental jobs keep going after a failed file (-k 0), so one run shows every error.
      # Below the job's limit, so the cache is still saved when the build runs out of time.
      - name: Build
        timeout-minutes: 160
        run: cmake --build --preset ci-debug ${{ runner.os != 'macOS' && '-- -k 0' || '' }}

      - name: ccache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-ci-${{ runner.os }}-${{ github.run_id }}

      # The tests run locally (scripts/verify.sh); on the hosted runners they take hours, so the CI
      # builds everything and tests only when started by hand with "tests".
      - name: Test
        if: github.event_name == 'workflow_dispatch' && inputs.tests
        run: ctest --preset ci-debug --timeout 600 -j 3

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ runner.os }}
          path: build/ci-debug/Testing/Temporary/
          retention-days: 14
